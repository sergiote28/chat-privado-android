name: Compilar app Android

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar
        run: gradle assembleDebug --no-daemon

      - name: Preparar el instalador
        run: cp app/build/outputs/apk/debug/app-debug.apk chat-privado.apk

      - name: Publicar el instalador
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-android
          name: Chat privado para Android
          body: Instalador (.apk) del chat privado. Bloquea las capturas de pantalla.
          files: chat-privado.apk
